name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        mcp: ["mcp>=2"]
        include:
          - { os: ubuntu-latest, python-version: "3.12", mcp: "mcp>=1.26,<2" }
          - { os: windows-latest, python-version: "3.12", mcp: "mcp>=2" }
          - { os: macos-latest, python-version: "3.12", mcp: "mcp>=2" }
    name: py${{ matrix.python-version }} ${{ matrix.os }} ${{ matrix.mcp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[all]" "${{ matrix.mcp }}"
      - name: Core (no dependencies)
        run: python rubicon.py
      - name: MCP adapter
        run: python rubicon_mcp.py
      - name: LLM planners (offline stubs, no API keys)
        run: python rubicon_llm.py
