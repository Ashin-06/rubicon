name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[all]"
      - name: Core
        run: python rubicon.py
      - name: MCP adapter
        run: python rubicon_mcp.py
      - name: LLM planners (offline stubs, no API keys)
        run: python rubicon_llm.py
