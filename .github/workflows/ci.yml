name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        mcp: ["mcp>=2"]
        include:
          - { os: ubuntu-latest, python-version: "3.12", mcp: "mcp>=1.26,<2" }
          - { os: windows-latest, python-version: "3.12", mcp: "mcp>=2" }
          - { os: macos-latest, python-version: "3.12", mcp: "mcp>=2" }
    name: py${{ matrix.python-version }} ${{ matrix.os }} ${{ matrix.mcp }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Core tests with only pytest installed (proves zero dependencies)
        run: |
          pip install pytest pytest-timeout
          pytest -q
      - name: Install
        run: pip install -e ".[all,dev]" "${{ matrix.mcp }}"
      - name: Test suite with coverage (no API keys, no network)
        run: pytest -q --cov --cov-report=term-missing

  random-order:
    runs-on: ubuntu-latest
    name: whole suite in random order
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[all,dev]" pytest-randomly
      - name: Fixed seed
        run: pytest -q -p randomly --randomly-seed=1
      - name: New seed every run (printed in the header to replay a failure)
        run: pytest -q -p randomly --randomly-seed=${{ github.run_id }}

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: PostgresJournal against PostgreSQL 17
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres  # a throwaway container, reachable only from this job
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RUBICON_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      RUBICON_FUZZ_PG: "200"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[postgres,dev]"
      - name: Contract tests and crash/maintenance fuzz on PostgreSQL
        run: pytest -q -rs tests/test_postgres.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build and check the distribution
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Test suite against the installed wheel, outside the source tree
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install "$(ls dist/*.whl)[all]" pytest pytest-timeout
          cp -r tests /tmp/wheel-tests && cp -r examples /tmp/examples
          cd /tmp
          /tmp/wheel/bin/python -m pytest -q wheel-tests
