[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rubicon-agents"
version = "0.8.3"
description = "Reversibility-aware execution for AI agents: undoable steps first, permanent steps last, rollback on failure."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ashin-06" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["agents", "llm", "mcp", "safety", "rollback", "saga", "planning", "transactions"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
mcp = ["mcp>=1.26"]
gemini = ["google-genai>=1.66"]
claude = ["anthropic>=0.86"]
openai = ["openai>=1.40"]
all = ["rubicon-agents[mcp,gemini,claude,openai]"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.urls]
Repository = "https://github.com/Ashin-06/rubicon"
Changelog = "https://github.com/Ashin-06/rubicon/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["rubicon", "rubicon_mcp", "rubicon_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "demo.py"]
