[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rubicon-agents"
version = "0.10.1"
description = "Reversibility-aware execution for AI agents: undoable steps first, permanent steps last, rollback on failure."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ashin-06" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["agents", "llm", "mcp", "safety", "rollback", "saga", "planning", "transactions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
mcp = ["mcp>=1.26"]
gemini = ["google-genai>=1.66"]
claude = ["anthropic>=0.86"]
openai = ["openai>=1.40"]
postgres = ["psycopg[binary]>=3.1"]
otel = ["opentelemetry-api>=1.20"]
langgraph = ["langgraph>=0.4"]
all = ["rubicon-agents[mcp,gemini,claude,openai,postgres,otel,langgraph]"]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-timeout>=2.3", "opentelemetry-sdk>=1.20"]

[project.urls]
Homepage = "https://github.com/Ashin-06/rubicon"
Documentation = "https://github.com/Ashin-06/rubicon#readme"
Repository = "https://github.com/Ashin-06/rubicon"
Issues = "https://github.com/Ashin-06/rubicon/issues"
Changelog = "https://github.com/Ashin-06/rubicon/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["rubicon", "rubicon_mcp", "rubicon_llm", "rubicon_otel", "rubicon_langgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120  # a hung test fails with every thread's stack instead of stalling CI

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "demo.py", "examples/*"]
