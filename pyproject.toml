[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubicon-agents"
version = "0.2.0"
description = "Reversibility-aware execution for AI agents: undoable steps first, permanent steps last, rollback on failure."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ashin-06" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["agents", "llm", "mcp", "safety", "rollback", "saga", "planning", "transactions"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
mcp = ["mcp>=1.26"]
gemini = ["google-genai>=1.66"]
claude = ["anthropic>=0.86"]
openai = ["openai>=1.40"]
all = ["rubicon-agents[mcp,gemini,claude,openai]"]

[project.urls]
Repository = "https://github.com/Ashin-06/rubicon"

[tool.setuptools]
py-modules = ["rubicon", "rubicon_mcp", "rubicon_llm"]
