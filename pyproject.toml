[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubicon-agents"
version = "0.1.0"
description = "Reversibility-aware execution for AI agent plans: undoable steps first, permanent steps last, rollback on failure."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ashin-06" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["agents", "llm", "mcp", "safety", "rollback", "saga", "planning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
mcp = ["mcp>=1.26", "pydantic-settings>=2"]
gemini = ["google-genai>=1.66"]
claude = ["anthropic>=0.86"]
all = ["rubicon-agents[mcp,gemini,claude]"]

[tool.setuptools]
py-modules = ["rubicon", "rubicon_mcp", "rubicon_llm"]
